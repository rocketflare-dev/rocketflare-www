# Build the static site and deploy it to Cloudflare Workers.
# Every push to main ships. A pull request is built and uploaded as a
# *preview version* (no traffic shifts) at pr-<n>-rocketflare-www.<subdomain>.workers.dev,
# and the URL is posted on the PR.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the preview-URL comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `build` runs `astro check` first, so a type error fails before a deploy.
      - run: npm run build

      # Preview for a pull request from this repository (a fork has no secrets).
      # `versions upload` creates an undeployed version reachable through the
      # preview alias; it needs `preview_urls: true` in wrangler.jsonc and a
      # workers.dev subdomain on the account. If the account has none, this step
      # fails — remove it rather than enabling workers.dev for production traffic.
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" | tee preview.log
          url=$(grep -o 'https://[^ ]*workers.dev[^ ]*' preview.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}'
            const marker = '<!-- preview-url -->'
            const body = `${marker}\nPreview for ${context.payload.pull_request.head.sha.slice(0, 7)}: ${url}`
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number })
            const mine = comments.find((c) => c.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
